name: Deploy game to GitHub Pages

on:
  push:
    branches: [claude/gameboy-ff4-style-game-2jjfja, main]
    paths: ["rpg/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (自動で有効化)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: rpg
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
