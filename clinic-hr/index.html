<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7490">
  <title>クリニック人事評価システム</title>
  <meta name="description" content="クリニック向けの人事評価システム。職員管理・自己/上司評価・目標管理(MBO)・ランク集計をブラウザだけで運用できるプロトタイプ。">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <strong>クリニック人事評価</strong>
        <span>HR Evaluation System</span>
      </div>
      <nav class="nav" id="navList" aria-label="メニュー"></nav>
      <div class="side-note">
        評価フロー：目標設定 → 自己評価 → 1次・2次評価 → 面談 → 確定。<br>
        データはこのブラウザ内に保存されます。
      </div>
    </aside>

    <main>
      <header class="app-header">
        <div>
          <h1 id="pageTitle">ダッシュボード</h1>
          <div id="pageSubtitle" class="sub"></div>
        </div>
        <div class="toolbar">
          <span class="pill">評価期間</span>
          <select id="periodSelect" aria-label="評価期間"></select>
        </div>
      </header>

      <section class="view active" id="view-dashboard"></section>
      <section class="view" id="view-staff"></section>
      <section class="view" id="view-evaluate"></section>
      <section class="view" id="view-goals"></section>
      <section class="view" id="view-criteria"></section>
      <section class="view" id="view-report"></section>
      <section class="view" id="view-settings"></section>
    </main>
  </div>

  <!-- Modal -->
  <div id="app-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="close" aria-label="閉じる">×</button>
      </div>
      <div class="modal-body"></div>
      <div class="modal-foot">
        <button class="ghost" id="modalCancel">キャンセル</button>
        <button class="primary" id="modalSave">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
