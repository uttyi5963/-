<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="クリスタルナイツ SNES風">
  <title>クリスタルナイツ 〜SNES風リメイク〜</title>
  <meta name="description" content="16色パレット・高解像度の SNES風グラフィックで あそぶ クリスタルナイツ リメイク。ブラウザだけで動作します。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23101020'/%3E%3Cpath d='M8 2 L12 8 L8 14 L4 8 Z' fill='%23e8b830'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #14141c;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shell {
      background: #d8d4cc;
      border-radius: 14px;
      padding: 18px 18px 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 100vw;
    }
    .screen-frame {
      background: #34343c;
      border-radius: 10px;
      padding: 14px 16px 16px;
    }
    .screen-label {
      color: #d8d8e0;
      font-size: 10px;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 6px;
    }
    canvas {
      display: block;
      width: min(94vw, 640px, calc((100vh - 200px) * 512 / 448));
      aspect-ratio: 512 / 448;
      background: #101020;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 3px solid #2a2a30;
    }
    .brand {
      color: #3a3a8c;
      font-weight: bold;
      font-style: italic;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .pad-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 6px 6px;
      gap: 12px;
    }
    .dpad { position: relative; width: 132px; height: 132px; flex: none; touch-action: none; }
    .dpad button {
      position: absolute; width: 44px; height: 44px; background: #2a2a30; border: none;
      border-radius: 6px; color: #888; font-size: 16px; touch-action: none; pointer-events: none;
    }
    .dpad .up { left: 44px; top: 0; }
    .dpad .down { left: 44px; top: 88px; }
    .dpad .left { left: 0; top: 44px; }
    .dpad .right { left: 88px; top: 44px; }
    .dpad .mid { left: 44px; top: 44px; border-radius: 0; }
    .ab { display: flex; gap: 14px; transform: rotate(-14deg); flex: none; }
    .ab button {
      width: 52px; height: 52px; border-radius: 50%; border: none; background: #3050a0;
      color: #d8e8ff; font-weight: bold; font-size: 16px; box-shadow: 0 3px 0 #1a3060; touch-action: none;
    }
    .ab button:active { transform: translateY(2px); box-shadow: 0 1px 0 #1a3060; }
    .hint { color: #55524c; font-size: 10px; text-align: center; padding-bottom: 4px; }
    @media (max-height: 560px) { .pad-row, .hint { display: none; } .shell { padding: 10px; border-radius: 10px; } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="screen-frame">
      <div class="screen-label">HI-COLOR RPG — CRYSTAL KNIGHTS SNES風</div>
      <canvas id="screen" width="512" height="448"></canvas>
    </div>
    <div class="brand">CLAUDE 16<span style="font-size:9px;">™</span></div>
    <div class="pad-row">
      <div class="dpad">
        <button class="up" data-key="ArrowUp">▲</button>
        <button class="left" data-key="ArrowLeft">◀</button>
        <button class="mid" disabled></button>
        <button class="right" data-key="ArrowRight">▶</button>
        <button class="down" data-key="ArrowDown">▼</button>
      </div>
      <div class="ab">
        <button data-key="x">B</button>
        <button data-key="z">A</button>
      </div>
    </div>
    <div class="hint">キーボード: 矢印キー移動 / Z=けってい / X=キャンセル</div>
  </div>
  <script>
    document.querySelectorAll("[data-key]").forEach((el) => {
      const fire = (type, key) => {
        const ev = new KeyboardEvent(type, { key });
        window.dispatchEvent(ev);
      };
      const keyMap = { ArrowUp: "ArrowUp", ArrowDown: "ArrowDown", ArrowLeft: "ArrowLeft", ArrowRight: "ArrowRight", z: "z", x: "x" };
      const k = keyMap[el.dataset.key];
      el.addEventListener("pointerdown", (e) => { e.preventDefault(); fire("keydown", k); });
      el.addEventListener("pointerup", (e) => { e.preventDefault(); fire("keyup", k); });
      el.addEventListener("pointerleave", (e) => { fire("keyup", k); });
    });
  </script>
  <script src="js/sprites.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/field.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
