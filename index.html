<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>AIOU日本語学校 N4 / JFT-Basic 学習アプリ</title>
  <meta name="description" content="AIOU日本語学校のN4・JFT-Basic対策アプリ。SRS単語学習、模試、AI会話、職種別日本語をブラウザだけで動作。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/icon.svg">
  <link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <strong>AIOU Japan Work Japanese</strong>
        <span>Educular prototype / N4・JFT-Basic</span>
      </div>
      <nav class="nav" id="navList" aria-label="Sections"></nav>
      <div id="userCard" class="user-card" aria-live="polite"></div>
      <div class="side-note">
        目的：6か月でN4/JFT-Basicの合格圏へ。学習量ではなく、合格見込みと介入対象を可視化する。
        <button id="installPrompt" hidden>📲 ホームに追加</button>
      </div>
    </aside>

    <main>
      <header class="app-header">
        <div>
          <h1 id="pageTitle">学習者画面</h1>
          <div id="pageSubtitle" class="sub">スマホ中心、毎日30〜90分、AI復習と教師介入を組み合わせる設計</div>
        </div>
        <div class="toolbar">
          <span id="cohortPill" class="pill">Cohort: PK-2026-07</span>
          <span class="pill">Target: JLPT N4 / JFT-Basic</span>
          <button class="primary" id="demoAdvance">週次チェックイン</button>
        </div>
      </header>

      <section class="view active" id="student"></section>
      <section class="view" id="foundation"></section>
      <section class="view" id="language"></section>
      <section class="view" id="teacher"></section>
      <section class="view" id="tests"></section>
      <section class="view" id="community"></section>
      <section class="view" id="jobs"></section>
      <section class="view" id="admin"></section>
    </main>
  </div>

  <!-- Modal shell -->
  <div id="app-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="close" aria-label="閉じる">×</button>
      </div>
      <div class="modal-body"></div>
      <div class="modal-foot"></div>
    </div>
  </div>

  <script type="module" src="./assets/js/app.js"></script>
  <script>
    // PWA install prompt support.
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('installPrompt');
      if (btn) {
        btn.hidden = false;
        btn.addEventListener('click', async () => {
          btn.hidden = true;
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
        }, { once: true });
      }
    });
  </script>
</body>
</html>
